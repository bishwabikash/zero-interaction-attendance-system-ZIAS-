# Raspberry Pi 4/5 overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.rpi.yml up -d

services:
  db:
    deploy:
      resources:
        limits:
          memory: 512M
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=64
      - --skip-log-bin
      - --performance-schema=OFF

  redis:
    deploy:
      resources:
        limits:
          memory: 128M
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  mosquitto:
    deploy:
      resources:
        limits:
          memory: 96M
    tmpfs:
      - /mosquitto/log:size=8m

  api:
    deploy:
      resources:
        limits:
          memory: 384M
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  processor:
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    deploy:
      resources:
        limits:
          memory: 64M
